global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The simulator listens on the host at [prometheus] bind = "0.0.0.0:9000".
  - job_name: chirpstack-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9000
        labels:
          service: chirpstack-simulator
